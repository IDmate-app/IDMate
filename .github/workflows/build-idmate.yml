name: Build IDmate Images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Match the runtime in triplog/Dockerfile (python:3.12-slim).
          python-version: '3.12'

      - name: Install dependencies
        # Runtime deps so the app-level tests (charge/gap detection) actually
        # run; without them the app tests would silently skip. The lighter
        # detector tests need only pytest (they stub influxdb_client).
        run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: triplog

      - name: Run tests
        run: pytest
        working-directory: triplog

      - name: Boot smoke test (start as the container does — python app.py)
        # CI builds the image but never RUNS it, and pytest imports app as a
        # module named 'app'. Neither path exercises `python app.py`, where the
        # module is '__main__' — exactly the case that hit the blueprint circular
        # import (fixed in 4d40e5d). Boot the app like the Dockerfile CMD and
        # require it to reach the serve stage. The "Listening" banner is printed
        # only after the whole module (incl. blueprint registration) has loaded,
        # so it is a reliable success signal; background-thread connection noise
        # (no influx/mqtt in CI) appears only afterwards and is ignored.
        run: |
          timeout 25s python app.py > boot.log 2>&1 || true
          if grep -q 'Listening' boot.log; then
            echo "Boot smoke OK — reached serve stage (blueprints registered)."
          else
            echo "::error::App did not reach the serve stage as __main__ — startup failure:"
            cat boot.log
            exit 1
          fi
        working-directory: triplog
        env:
          SECRET_KEY: ci-boot-smoke
          DB_PATH: /tmp/boot-smoke.db

  triplog:
    needs: test
    # Only build/push images for real refs, not for PR validation runs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image lives under the repository owner (ghcr wants lower case):
      # ghcr.io/idmate-app/idmate — follows a repository transfer.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/idmate" >> "$GITHUB_ENV"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          # Tag matrix:
          #   git tag v1.2.3 -> 1.2.3, 1.2, 1, latest
          #   main branch    -> main, latest, <sha>
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ./triplog
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
